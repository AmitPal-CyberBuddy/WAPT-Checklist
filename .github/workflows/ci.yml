name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Validate schema review sample
        run: node tools/validate.js checklist/sample.json

      - name: Validate all production category floors
        run: node tools/validate.js --floors

      - name: Validate authoritative references and mapping editions
        run: node tools/check-references.js

      - name: Audit content quality and safety
        run: node tools/audit-content.js
